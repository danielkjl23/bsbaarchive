        {
          id: 'select-chapter-assessment',
          label: 'Select chapter assessment',
          onSelect: () => {
            // Placeholder for now — more choices coming later.
            console.log('Select chapter assessment clicked');
          },

        {
          id: 'select-chapter-download',
          label: 'Select Chapter Download',

            window.openChapterDownloadPicker(module, moduleTitle);
