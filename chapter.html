<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="aura-bg">
      <div class="aura-layer-1" aria-hidden="true"></div>
      <div class="aura-layer-2" aria-hidden="true"></div>
      <div class="aura-layer-3" aria-hidden="true"></div>
      <div class="aura-layer-4" aria-hidden="true"></div>
      <div class="aura-content">
        <div class="page page--top">
          <div class="back-links-row">
            <a href="index.html" class="back-link" id="backLink">&larr; Back</a>
            <span class="back-links-divider">&bull;</span>
            <a href="index.html" class="back-link">Archive</a>
          </div>
          <h1 class="page-title" id="chapterHeading">Chapter</h1>
          <div class="chapter-title-space chapter-title-space--detail" id="chapterTitleSpace"></div>

          <div class="chapter-content-wrap" id="chapterContentWrap">
            <div class="toolbar-sentinel" id="toolbarSentinel" aria-hidden="true"></div>
            <div class="chapter-toolbar" id="chapterToolbar">
              <div class="toolbar-group" id="historyControls">
                <button
                  class="history-btn"
                  id="undoBtn"
                  type="button"
                  aria-label="Undo last change"
                  disabled
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                </button>
                <button
                  class="history-btn"
                  id="redoBtn"
                  type="button"
                  aria-label="Redo last change"
                  disabled
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
                </button>
                <button
                  class="history-btn"
                  id="resetBtn"
                  type="button"
                  aria-label="Reset chapter to original text"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                </button>
              </div>
              <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Switch between light and dark mode"
                aria-pressed="false"
              >
                <span class="theme-toggle-track">
                  <span class="theme-toggle-knob">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
                  </span>
                </span>
              </button>
            </div>
            <div
              class="chapter-content"
              id="chapterContent"
              data-placeholder="No content yet — this chapter's text is added directly in chapter-content.js."
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="chapter-content.js"></script>
    <script>
      // ---- Read module/chapter/color from the URL ----
      const params = new URLSearchParams(window.location.search);
      const moduleKey = params.get('module') || '';
      const num = params.get('num') || '1';
      const color = params.get('color') || 'blue';
      const moduleTitle = params.get('moduleTitle') || 'Archives';

      const ACCENTS = { blue: '#38bdf8', green: '#34d399', amber: '#fbbf24' };
      document.documentElement.style.setProperty('--accent', ACCENTS[color] || ACCENTS.blue);

      document.getElementById('chapterHeading').textContent = `Chapter ${num}`;
      const backLink = document.getElementById('backLink');
      backLink.textContent = `\u2190 Back to ${moduleTitle}`;
      backLink.href = moduleKey ? `${moduleKey}.html` : 'index.html';
      document.title = `Chapter ${num} \u2014 ${moduleTitle}`;

      const content = document.getElementById('chapterContent');
      const contentKey = `${moduleKey}-${num}`;
      const PROGRESS_KEY = `bsba-progress:${contentKey}`;

      // ---- Fill in the reserved blank space below "Chapter N" with
      // this chapter's title, if one's been set in chapter-content.js. ----
      const chapterTitleSpace = document.getElementById('chapterTitleSpace');
      const chapterTitleText = (window.CHAPTER_TITLES && window.CHAPTER_TITLES[contentKey]) || '';
      if (chapterTitleSpace && chapterTitleText) {
        chapterTitleSpace.textContent = chapterTitleText;
        chapterTitleSpace.classList.add('has-title');
      }

      // ---- Load content: base text from chapter-content.js (the only
      // place anyone can actually add/edit/remove text), with any saved
      // highlight/underline/bold marks from this browser layered on top. ----
      function loadContent() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        let workingHtml = baseHtml;

        try {
          const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
          // Only reuse the saved (formatted) version if the underlying
          // base text hasn't changed since it was saved — otherwise an
          // update to chapter-content.js would be silently hidden.
          if (saved && saved.baseHtml === baseHtml && typeof saved.workingHtml === 'string') {
            workingHtml = saved.workingHtml;
          }
        } catch (err) {
          // Storage blocked/corrupt — just fall back to the base content.
        }

        content.innerHTML = workingHtml;
      }

      function saveProgress() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        try {
          localStorage.setItem(
            PROGRESS_KEY,
            JSON.stringify({ baseHtml, workingHtml: content.innerHTML })
          );
        } catch (err) {
          // Storage full/blocked — formatting still works this session,
          // it just won't persist on reload.
        }
      }

      loadContent();

      // ---- Light / dark mode toggle for the content box ----
      const themeToggle = document.getElementById('themeToggle');
      const contentWrap = document.getElementById('chapterContentWrap');
      themeToggle.addEventListener('click', () => {
        const isLight = contentWrap.classList.toggle('is-light');
        themeToggle.setAttribute('aria-pressed', String(isLight));
      });

      // ---- Sticky toolbar: once scrolling carries it to the top of
      // the screen, the toolbar pins there (CSS position: sticky) and
      // gathers into a compact pill on the left — the theme toggle
      // glides over to join the undo/redo/reset cluster in one smooth
      // motion rather than just snapping into place (a "FLIP" style
      // animation: read its position before the layout change, then
      // animate from there back to its new resting spot). ----
      const chapterToolbar = document.getElementById('chapterToolbar');
      const toolbarSentinel = document.getElementById('toolbarSentinel');

      function setToolbarStuck(stuck) {
        if (!chapterToolbar || chapterToolbar.classList.contains('is-stuck') === stuck) return;
        const before = themeToggle.getBoundingClientRect();

        chapterToolbar.classList.toggle('is-stuck', stuck);

        const after = themeToggle.getBoundingClientRect();
        const dx = before.left - after.left;
        if (dx) {
          themeToggle.style.transition = 'none';
          themeToggle.style.transform = `translateX(${dx}px)`;
          requestAnimationFrame(() => {
            themeToggle.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
            themeToggle.style.transform = 'translateX(0)';
          });
        }
      }

      if (toolbarSentinel && 'IntersectionObserver' in window) {
        const stickyObserver = new IntersectionObserver(
          ([entry]) => setToolbarStuck(!entry.isIntersecting),
          { threshold: 0, rootMargin: '-13px 0px 0px 0px' }
        );
        stickyObserver.observe(toolbarSentinel);
      }

      // ---- Highlight / underline / bold: selection-aware toolbar ----
      //   1) Selecting text updates the three buttons to reflect whether
      //      the selection has that formatting anywhere in it (lit = yes,
      //      even for just part of the selection).
      //   2) Tapping a lit button strips that formatting from exactly
      //      the selected text.
      //   3) Tapping an unlit button (selection has none, or only part
      //      of it, formatted) applies that formatting across the WHOLE
      //      selection — extending it to cover the previously-unformatted
      //      part too, without double-wrapping the part that already had it.
      // Selection boundaries are handled via Range.extractContents(),
      // which splits any spans straddling the edges automatically, so
      // this never nests/duplicates formatting the way exact-boundary
      // matching used to.
      const HIGHLIGHT_COLOR = '#00e5ff'; // sampled from the provided swatch
      let highlightBtn = null;
      let underlineBtn = null;
      let boldBtn = null;
      let lastSelectionRange = null;

      function setBtnActive(btn, active) {
        if (btn) btn.classList.toggle('is-active', active);
      }

      // Same robust tap handling as widget.js's helper, defined locally
      // so it works regardless of script load order (this inline script
      // runs before widget.js loads). Fires once per tap — touchend on
      // touch devices, click otherwise — without double-firing.
      function addTapListener(el, handler) {
        if (!el) return;
        let firedByTouch = false;
        el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        el.addEventListener(
          'touchend',
          (e) => {
            e.preventDefault();
            firedByTouch = true;
            handler(e);
            setTimeout(() => {
              firedByTouch = false;
            }, 500);
          },
          { passive: false }
        );
        el.addEventListener('click', (e) => {
          if (firedByTouch) return;
          handler(e);
        });
      }

      function isWhitespaceOnly(str) {
        return !str || !str.trim();
      }

      function hasClassAncestorWithin(node, root, className) {
        let el = node.parentNode;
        while (el && el !== root) {
          if (el.classList && el.classList.contains(className)) return true;
          el = el.parentNode;
        }
        return false;
      }

      // True if every non-whitespace character in the range already has
      // `className` somewhere in its ancestor chain. Whitespace-only text
      // (stray spaces caught at the edge of a selection) is ignored, so
      // a selection with a trailing/leading space still registers as
      // "fully formatted" if the actual words are.
      function isRangeFullyFormatted(range, className) {
        const fragment = range.cloneContents();
        const walker = document.createTreeWalker(fragment, NodeFilter.SHOW_TEXT, null);
        let hasRealText = false;
        let node;
        while ((node = walker.nextNode())) {
          if (isWhitespaceOnly(node.data)) continue;
          hasRealText = true;
          if (!hasClassAncestorWithin(node, fragment, className)) return false;
        }
        return hasRealText;
      }

      // True if AT LEAST ONE non-whitespace character in the range has
      // `className` in its ancestor chain — used to light up the
      // toolbar buttons. Unlike isRangeFullyFormatted (above), this
      // doesn't require the whole selection to share the formatting:
      // selecting a highlighted word plus some plain trailing text (or
      // stray spaces) still lights the button up, as long as any of
      // the selected text actually has it.
      function isRangeAnyFormatted(range, className) {
        const fragment = range.cloneContents();
        const walker = document.createTreeWalker(fragment, NodeFilter.SHOW_TEXT, null);
        let node;
        while ((node = walker.nextNode())) {
          if (isWhitespaceOnly(node.data)) continue;
          if (hasClassAncestorWithin(node, fragment, className)) return true;
        }
        return false;
      }

      function unwrapClassFrom(root, className) {
        if (!root.querySelectorAll) return;
        Array.from(root.querySelectorAll('.' + className)).forEach((el) => {
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          parent.removeChild(el);
        });
      }

      function toggleFormatOnRange(range, className, styleFn) {
        const alreadyFormatted = isRangeFullyFormatted(range, className);
        const frag = range.extractContents();
        // Always strip any existing spans of this class from the
        // extracted slice first — this both handles the "remove" case
        // and prevents double-nesting when "applying" over a selection
        // that's only partially formatted.
        unwrapClassFrom(frag, className);
        if (!alreadyFormatted) {
          const wrapper = document.createElement('span');
          wrapper.className = className;
          styleFn(wrapper);
          wrapper.appendChild(frag);
          range.insertNode(wrapper);
        } else {
          range.insertNode(frag);
        }
        content.normalize();
      }

      function getContentSelectionRange() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
        const range = sel.getRangeAt(0);
        if (!content.contains(range.commonAncestorContainer)) return null;
        return range;
      }

      function refreshToolbarFromSelection() {
        const range = getContentSelectionRange();
        if (!range) {
          setBtnActive(highlightBtn, false);
          setBtnActive(underlineBtn, false);
          setBtnActive(boldBtn, false);
          return;
        }
        lastSelectionRange = range.cloneRange();
        setBtnActive(highlightBtn, isRangeAnyFormatted(range, 'user-highlight'));
        setBtnActive(underlineBtn, isRangeAnyFormatted(range, 'user-underline'));
        setBtnActive(boldBtn, isRangeAnyFormatted(range, 'user-bold'));
      }

      document.addEventListener('selectionchange', refreshToolbarFromSelection);
      // selectionchange can lag or misfire on mobile right at the moment
      // a finger lifts — re-check explicitly on touchend as a backstop.
      content.addEventListener('touchend', () => setTimeout(refreshToolbarFromSelection, 0));

      // ---- Undo / redo history for content edits ----
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const HISTORY_LIMIT = 50;
      let undoStack = [];
      let redoStack = [];
      let restoringHistory = false;

      function updateHistoryButtons() {
        if (undoBtn) undoBtn.disabled = undoStack.length === 0;
        if (redoBtn) redoBtn.disabled = redoStack.length === 0;
      }

      function pushHistory() {
        if (restoringHistory) return;
        undoStack.push(content.innerHTML);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      }

      function restoreSnapshot(html) {
        restoringHistory = true;
        content.innerHTML = html;
        restoringHistory = false;
        saveProgress();
        updateHistoryButtons();
        refreshToolbarFromSelection();
      }

      function undoChange() {
        if (!undoStack.length) return;
        redoStack.push(content.innerHTML);
        restoreSnapshot(undoStack.pop());
      }

      function redoChange() {
        if (!redoStack.length) return;
        undoStack.push(content.innerHTML);
        restoreSnapshot(redoStack.pop());
      }

      addTapListener(undoBtn, undoChange);
      addTapListener(redoBtn, redoChange);

      // ---- Reset: wipes all highlight/underline/bold marks and
      // restores the chapter to the original text straight from
      // chapter-content.js (also clears the saved copy in this
      // browser's storage). Goes on the undo stack first, so a reset
      // done by accident can still be undone. ----
      const resetBtn = document.getElementById('resetBtn');

      function resetChapterContent() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        if (content.innerHTML === baseHtml) return;
        const confirmed = window.confirm(
          'Reset this chapter back to its original text? This removes all your highlights, underlines, and bold marks.'
        );
        if (!confirmed) return;

        pushHistory();
        restoringHistory = true;
        content.innerHTML = baseHtml;
        restoringHistory = false;
        redoStack = [];
        updateHistoryButtons();
        saveProgress();
        refreshToolbarFromSelection();
      }

      addTapListener(resetBtn, resetChapterContent);

      function applyFormatToggle(className, styleFn) {
        let range = getContentSelectionRange();
        if (!range && lastSelectionRange) range = lastSelectionRange.cloneRange();
        if (!range) return;

        pushHistory();
        toggleFormatOnRange(range, className, styleFn);
        lastSelectionRange = null;
        saveProgress();
        refreshToolbarFromSelection();

        const sel = window.getSelection();
        if (sel) sel.removeAllRanges();
      }

      function wireToolbarButton(btn, className, styleFn) {
        if (!btn) return;
        addTapListener(btn, () => applyFormatToggle(className, styleFn));
      }

      // ---- Download this chapter as a Word (.doc) file ----
      // Captures whatever's currently in the content box, including any
      // highlight/underline/bold applied — Times New Roman, 8pt, 2 columns.
      function downloadChapterAsWord() {
        const bodyHtml = content.innerHTML.trim() || '<p></p>';
        const doc = `<!doctype html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>Chapter ${num}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page {
    size: 8.5in 11in;
    margin: 1in;
    mso-columns: 2;
  }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 8pt;
    text-align: justify;
  }
  h2, h3 {
    font-family: "Times New Roman", Times, serif;
    font-size: 10pt;
    text-align: left;
  }
  p {
    text-align: justify;
    margin: 0 0 8pt;
  }
  li {
    text-align: justify;
  }
  .doc-columns {
    mso-columns-count: 2;
    column-count: 2;
    column-gap: 24pt;
  }
</style>
</head>
<body>
  <h2>Chapter ${num} \u2014 ${moduleTitle}</h2>
  <div class="doc-columns">${bodyHtml}</div>
</body>
</html>`;

        const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${moduleTitle.replace(/\s+/g, '-')}-Chapter-${num}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ---- FAB options for this page ----
      window.FAB_OPTIONS = [
        {
          id: 'highlight',
          label: 'Highlight text',
          onMount: (btn) => {
            highlightBtn = btn;
            wireToolbarButton(btn, 'user-highlight', (el) => {
              el.style.backgroundColor = HIGHLIGHT_COLOR;
              el.style.color = '#0f172a';
            });
          },
        },
        {
          id: 'underline',
          label: 'Underline text',
          onMount: (btn) => {
            underlineBtn = btn;
            wireToolbarButton(btn, 'user-underline', (el) => {
              el.style.textDecoration = 'underline';
            });
          },
        },
        {
          id: 'bold',
          label: 'Bold text',
          onMount: (btn) => {
            boldBtn = btn;
            wireToolbarButton(btn, 'user-bold', (el) => {
              el.style.fontWeight = '700';
            });
          },
        },
        {
          id: 'assessment-test',
          label: 'Assessment test',
          onSelect: () => {
            // Placeholder for now — tell me what this should do when ready,
            // and I'll wire up autosaving for it the same way as the text.
            console.log('Assessment test clicked:', moduleTitle, 'Chapter', num);
          },
        },
        {
          id: 'download',
          label: 'Download this chapter',
          onSelect: downloadChapterAsWord,
        },
      ];
    </script>
    <script src="widget.js"></script>
  </body>
</html>
