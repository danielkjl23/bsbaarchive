<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="aura-bg">
      <div class="aura-layer-1" aria-hidden="true"></div>
      <div class="aura-layer-2" aria-hidden="true"></div>
      <div class="aura-layer-3" aria-hidden="true"></div>
      <div class="aura-layer-4" aria-hidden="true"></div>
      <div class="aura-content">
        <div class="page page--top">
          <div class="back-links-row">
            <a href="index.html" class="back-link" id="backLink">&larr; Back</a>
            <span class="back-links-divider">&bull;</span>
            <a href="index.html" class="back-link">Archive</a>
          </div>
          <h1 class="page-title" id="chapterHeading">Chapter</h1>
          <div class="chapter-title-space chapter-title-space--detail" id="chapterTitleSpace"></div>

          <div class="chapter-content-wrap" id="chapterContentWrap">
            <button
              class="theme-toggle"
              id="themeToggle"
              type="button"
              aria-label="Switch between light and dark mode"
              aria-pressed="false"
            >
              <span class="theme-toggle-track">
                <span class="theme-toggle-knob">
                  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
                </span>
              </span>
            </button>
            <div
              class="chapter-content"
              id="chapterContent"
              data-placeholder="No content yet — this chapter's text is added directly in chapter-content.js."
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="chapter-content.js"></script>
    <script>
      // ---- Read module/chapter/color from the URL ----
      const params = new URLSearchParams(window.location.search);
      const moduleKey = params.get('module') || '';
      const num = params.get('num') || '1';
      const color = params.get('color') || 'blue';
      const moduleTitle = params.get('moduleTitle') || 'Archives';

      const ACCENTS = { blue: '#38bdf8', green: '#34d399', amber: '#fbbf24' };
      document.documentElement.style.setProperty('--accent', ACCENTS[color] || ACCENTS.blue);

      document.getElementById('chapterHeading').textContent = `Chapter ${num}`;
      const backLink = document.getElementById('backLink');
      backLink.textContent = `\u2190 Back to ${moduleTitle}`;
      backLink.href = moduleKey ? `${moduleKey}.html` : 'index.html';
      document.title = `Chapter ${num} \u2014 ${moduleTitle}`;

      const content = document.getElementById('chapterContent');
      const contentKey = `${moduleKey}-${num}`;
      const PROGRESS_KEY = `bsba-progress:${contentKey}`;

      // ---- Load content: base text from chapter-content.js (the only
      // place anyone can actually add/edit/remove text), with any saved
      // highlight/underline/bold marks from this browser layered on top. ----
      function loadContent() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        let workingHtml = baseHtml;

        try {
          const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
          // Only reuse the saved (formatted) version if the underlying
          // base text hasn't changed since it was saved — otherwise an
          // update to chapter-content.js would be silently hidden.
          if (saved && saved.baseHtml === baseHtml && typeof saved.workingHtml === 'string') {
            workingHtml = saved.workingHtml;
          }
        } catch (err) {
          // Storage blocked/corrupt — just fall back to the base content.
        }

        content.innerHTML = workingHtml;
      }

      function saveProgress() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        try {
          localStorage.setItem(
            PROGRESS_KEY,
            JSON.stringify({ baseHtml, workingHtml: content.innerHTML })
          );
        } catch (err) {
          // Storage full/blocked — formatting still works this session,
          // it just won't persist on reload.
        }
      }

      loadContent();

      // ---- Light / dark mode toggle for the content box ----
      const themeToggle = document.getElementById('themeToggle');
      const contentWrap = document.getElementById('chapterContentWrap');
      themeToggle.addEventListener('click', () => {
        const isLight = contentWrap.classList.toggle('is-light');
        themeToggle.setAttribute('aria-pressed', String(isLight));
      });

      // ---- Highlight / underline / bold: selection-aware toolbar ----
      // No "armed pen" mode and no separate Clean button. Instead:
      //   1) Selecting text updates the three buttons to reflect whether
      //      the WHOLE selection already has that formatting (lit = yes).
      //   2) Tapping a lit button strips that formatting from the
      //      selection (this replaces "Clean", per format).
      //   3) Tapping an unlit button applies that formatting to the
      //      selection.
      // On mobile, selecting text is already fragile, so tapping a
      // toolbar button is set up not to steal/collapse the selection
      // (mousedown/touchstart preventDefault + a cached last-range
      // fallback in case the browser drops it anyway).
      const HIGHLIGHT_COLOR = '#00e5ff'; // sampled from the provided swatch
      let highlightBtn = null;
      let underlineBtn = null;
      let boldBtn = null;
      let lastSelectionRange = null;

      function setBtnActive(btn, active) {
        if (btn) btn.classList.toggle('is-active', active);
      }

      function findFormatAncestor(node, className) {
        let el = node.nodeType === 3 ? node.parentElement : node;
        while (el && el !== content) {
          if (el.classList && el.classList.contains(className)) return el;
          el = el.parentElement;
        }
        return null;
      }

      function isRangeFullyFormatted(range, className) {
        const startAncestor = findFormatAncestor(range.startContainer, className);
        const endAncestor = findFormatAncestor(range.endContainer, className);
        return !!(startAncestor && startAncestor === endAncestor);
      }

      function toggleFormatOnRange(range, className, styleFn) {
        const startAncestor = findFormatAncestor(range.startContainer, className);
        const endAncestor = findFormatAncestor(range.endContainer, className);

        if (startAncestor && startAncestor === endAncestor) {
          // Already has this formatting — remove it (the "clean" case).
          const parent = startAncestor.parentNode;
          while (startAncestor.firstChild) {
            parent.insertBefore(startAncestor.firstChild, startAncestor);
          }
          parent.removeChild(startAncestor);
          parent.normalize();
        } else {
          // Doesn't have it yet — apply it.
          const wrapper = document.createElement('span');
          wrapper.className = className;
          styleFn(wrapper);
          try {
            range.surroundContents(wrapper);
          } catch (err) {
            const frag = range.extractContents();
            wrapper.appendChild(frag);
            range.insertNode(wrapper);
          }
        }
      }

      function getContentSelectionRange() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
        const range = sel.getRangeAt(0);
        if (!content.contains(range.commonAncestorContainer)) return null;
        return range;
      }

      function refreshToolbarFromSelection() {
        const range = getContentSelectionRange();
        if (!range) {
          setBtnActive(highlightBtn, false);
          setBtnActive(underlineBtn, false);
          setBtnActive(boldBtn, false);
          return;
        }
        lastSelectionRange = range.cloneRange();
        setBtnActive(highlightBtn, isRangeFullyFormatted(range, 'user-highlight'));
        setBtnActive(underlineBtn, isRangeFullyFormatted(range, 'user-underline'));
        setBtnActive(boldBtn, isRangeFullyFormatted(range, 'user-bold'));
      }

      document.addEventListener('selectionchange', refreshToolbarFromSelection);

      function applyFormatToggle(className, styleFn) {
        let range = getContentSelectionRange();
        if (!range && lastSelectionRange) range = lastSelectionRange.cloneRange();
        if (!range) return;

        toggleFormatOnRange(range, className, styleFn);
        lastSelectionRange = null;
        saveProgress();
        refreshToolbarFromSelection();
      }

      function wireToolbarButton(btn, className, styleFn) {
        if (!btn) return;
        // Belt-and-suspenders on top of widget.js's own mousedown guard —
        // also cover touchstart so mobile taps don't collapse the selection.
        btn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        btn.addEventListener('click', () => applyFormatToggle(className, styleFn));
      }

      // ---- Download this chapter as a Word (.doc) file ----
      // Captures whatever's currently in the content box, including any
      // highlight/underline/bold applied — Times New Roman, 8pt, 2 columns.
      function downloadChapterAsWord() {
        const bodyHtml = content.innerHTML.trim() || '<p></p>';
        const doc = `<!doctype html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>Chapter ${num}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page {
    size: 8.5in 11in;
    margin: 1in;
    mso-columns: 2;
  }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 8pt;
  }
  h2 {
    font-family: "Times New Roman", Times, serif;
    font-size: 12pt;
  }
  .doc-columns {
    mso-columns-count: 2;
    column-count: 2;
    column-gap: 24pt;
  }
</style>
</head>
<body>
  <h2>Chapter ${num} \u2014 ${moduleTitle}</h2>
  <div class="doc-columns">${bodyHtml}</div>
</body>
</html>`;

        const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${moduleTitle.replace(/\s+/g, '-')}-Chapter-${num}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ---- FAB options for this page ----
      window.FAB_OPTIONS = [
        {
          id: 'highlight',
          label: 'Highlight text',
          onMount: (btn) => {
            highlightBtn = btn;
            wireToolbarButton(btn, 'user-highlight', (el) => {
              el.style.backgroundColor = HIGHLIGHT_COLOR;
              el.style.color = '#0f172a';
            });
          },
        },
        {
          id: 'underline',
          label: 'Underline text',
          onMount: (btn) => {
            underlineBtn = btn;
            wireToolbarButton(btn, 'user-underline', (el) => {
              el.style.textDecoration = 'underline';
            });
          },
        },
        {
          id: 'bold',
          label: 'Bold text',
          onMount: (btn) => {
            boldBtn = btn;
            wireToolbarButton(btn, 'user-bold', (el) => {
              el.style.fontWeight = '700';
            });
          },
        },
        {
          id: 'assessment-test',
          label: 'Assessment test',
          onSelect: () => {
            // Placeholder for now — tell me what this should do when ready,
            // and I'll wire up autosaving for it the same way as the text.
            console.log('Assessment test clicked:', moduleTitle, 'Chapter', num);
          },
        },
        {
          id: 'download',
          label: 'Download this chapter',
          onSelect: downloadChapterAsWord,
        },
      ];
    </script>
    <script src="widget.js"></script>
  </body>
</html>
