<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="aura-bg">
      <div class="aura-layer-1" aria-hidden="true"></div>
      <div class="aura-layer-2" aria-hidden="true"></div>
      <div class="aura-layer-3" aria-hidden="true"></div>
      <div class="aura-layer-4" aria-hidden="true"></div>
      <div class="aura-content">
        <div class="page page--top">
          <div class="back-links-row">
            <a href="index.html" class="back-link" id="backLink">&larr; Back</a>
            <span class="back-links-divider">&bull;</span>
            <a href="index.html" class="back-link">Archive</a>
          </div>
          <h1 class="page-title" id="chapterHeading">Chapter</h1>
          <div class="chapter-title-space chapter-title-space--detail" id="chapterTitleSpace"></div>

          <div class="chapter-content-wrap" id="chapterContentWrap">
            <div class="toolbar-sentinel" id="toolbarSentinel" aria-hidden="true"></div>
            <div class="chapter-toolbar" id="chapterToolbar">
              <div class="toolbar-group" id="historyControls">
                <button
                  class="history-btn"
                  id="undoBtn"
                  type="button"
                  aria-label="Undo last change"
                  disabled
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                </button>
                <button
                  class="history-btn"
                  id="redoBtn"
                  type="button"
                  aria-label="Redo last change"
                  disabled
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
                </button>
                <button
                  class="history-btn"
                  id="resetBtn"
                  type="button"
                  aria-label="Reset chapter to original text"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                </button>
              </div>
              <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Switch between light and dark mode"
                aria-pressed="false"
              >
                <span class="theme-toggle-track">
                  <span class="theme-toggle-knob">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
                  </span>
                </span>
              </button>
            </div>
            <div
              class="chapter-content"
              id="chapterContent"
              data-placeholder="No content yet — this chapter's text is added directly in chapter-content.js."
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="chapter-content.js"></script>
    <script>
      // ---- Read module/chapter/color from the URL ----
      const params = new URLSearchParams(window.location.search);
      const moduleKey = params.get('module') || '';
      const num = params.get('num') || '1';
      const color = params.get('color') || 'blue';
      const moduleTitle = params.get('moduleTitle') || 'Archives';

      const ACCENTS = { blue: '#38bdf8', green: '#34d399', amber: '#fbbf24' };
      document.documentElement.style.setProperty('--accent', ACCENTS[color] || ACCENTS.blue);

      document.getElementById('chapterHeading').textContent = `Chapter ${num}`;
      const backLink = document.getElementById('backLink');
      backLink.textContent = `\u2190 Back to ${moduleTitle}`;
      backLink.href = moduleKey ? `${moduleKey}.html` : 'index.html';
      document.title = `Chapter ${num} \u2014 ${moduleTitle}`;

      const content = document.getElementById('chapterContent');
      const contentKey = `${moduleKey}-${num}`;
      const PROGRESS_KEY = `bsba-progress:${contentKey}`;

      // ---- Fill in the reserved blank space below "Chapter N" with
      // this chapter's title, if one's been set in chapter-content.js. ----
      const chapterTitleSpace = document.getElementById('chapterTitleSpace');
      const chapterTitleText = (window.CHAPTER_TITLES && window.CHAPTER_TITLES[contentKey]) || '';
      if (chapterTitleSpace && chapterTitleText) {
        chapterTitleSpace.textContent = chapterTitleText;
        chapterTitleSpace.classList.add('has-title');
      }

      // ---- Load content: base text from chapter-content.js (the only
      // place anyone can actually add/edit/remove text), with any saved
      // highlight/underline/bold marks from this browser layered on top. ----
      function loadContent() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        let workingHtml = baseHtml;

        try {
          const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
          // Only reuse the saved (formatted) version if the underlying
          // base text hasn't changed since it was saved — otherwise an
          // update to chapter-content.js would be silently hidden.
          if (saved && saved.baseHtml === baseHtml && typeof saved.workingHtml === 'string') {
            workingHtml = saved.workingHtml;
          }
        } catch (err) {
          // Storage blocked/corrupt — just fall back to the base content.
        }

        content.innerHTML = workingHtml;
      }

      function saveProgress() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        try {
          localStorage.setItem(
            PROGRESS_KEY,
            JSON.stringify({ baseHtml, workingHtml: content.innerHTML })
          );
        } catch (err) {
          // Storage full/blocked — formatting still works this session,
          // it just won't persist on reload.
        }
      }

      loadContent();

      // ---- Light / dark mode toggle for the content box ----
      const themeToggle = document.getElementById('themeToggle');
      const contentWrap = document.getElementById('chapterContentWrap');
      themeToggle.addEventListener('click', () => {
        const isLight = contentWrap.classList.toggle('is-light');
        themeToggle.setAttribute('aria-pressed', String(isLight));
      });

      // ---- Toolbar: normally sits in flow above the content. Once
      // scrolling carries it to the top of the screen, an
      // IntersectionObserver watching a 1px sentinel above it flips
      // on the "is-stuck" class, which CSS uses to switch it to
      // position: fixed at that exact point (JS-driven rather than
      // native CSS position: sticky, since an overflow: hidden
      // ancestor — .aura-bg, used for the background glow — silently
      // breaks position: sticky on mobile Safari/some Android):
      //   - Desktop: CSS docks it as a fixed vertical stack in the
      //     left corner of the viewport (see style.css).
      //   - Mobile: CSS pins it to the top at the same left/right
      //     position it already had — no repositioning needed beyond
      //     the class toggle itself. ----
      const chapterToolbar = document.getElementById('chapterToolbar');
      const toolbarSentinel = document.getElementById('toolbarSentinel');

      function setToolbarStuck(stuck) {
        if (!chapterToolbar) return;
        chapterToolbar.classList.toggle('is-stuck', stuck);
        positionToolbarToContent();
      }

      if (toolbarSentinel && 'IntersectionObserver' in window) {
        const stickyObserver = new IntersectionObserver(
          ([entry]) => setToolbarStuck(!entry.isIntersecting),
          { threshold: 0, rootMargin: '-13px 0px 0px 0px' }
        );
        stickyObserver.observe(toolbarSentinel);
      }

      // ---- Desktop only: once the toolbar is actually stuck (floating
      // as a vertical dock), hug it to the actual left edge of the
      // content container instead of a fixed distance from the browser
      // window's edge — measured, since the container's width varies
      // by viewport. While it's NOT stuck (normal in-flow position at
      // the top of the page), this leaves it alone entirely — applying
      // any offset then would shove it out of its normal spot, which is
      // exactly what was making it disappear from the top of the page.
      // Mobile keeps its own layout entirely untouched either way. ----
      const toolbarDesktopQuery = window.matchMedia('(min-width: 601px)');
      const TOOLBAR_EDGE_GAP = 16; // px, ~1rem gap between the dock and the content edge

      function positionToolbarToContent() {
        if (!chapterToolbar || !contentWrap) return;
        if (!toolbarDesktopQuery.matches || !chapterToolbar.classList.contains('is-stuck')) {
          chapterToolbar.style.left = '';
          chapterToolbar.style.right = '';
          return;
        }
        const rect = contentWrap.getBoundingClientRect();
        chapterToolbar.style.left = 'auto';
        chapterToolbar.style.right = `${Math.round(window.innerWidth - rect.left + TOOLBAR_EDGE_GAP)}px`;
      }

      positionToolbarToContent();
      window.addEventListener('resize', positionToolbarToContent);
      window.addEventListener('load', positionToolbarToContent);

      // ---- Highlight / underline / bold: selection-aware toolbar ----
      //   1) Selecting text updates the three buttons to reflect whether
      //      the selection has that formatting anywhere in it (lit = yes,
      //      even for just part of the selection).
      //   2) Tapping a lit button strips that formatting from exactly
      //      the selected text.
      //   3) Tapping an unlit button (selection has none, or only part
      //      of it, formatted) applies that formatting across the WHOLE
      //      selection — extending it to cover the previously-unformatted
      //      part too, without double-wrapping the part that already had it.
      // Selection boundaries are handled via Range.extractContents(),
      // which splits any spans straddling the edges automatically, so
      // this never nests/duplicates formatting the way exact-boundary
      // matching used to.
      const HIGHLIGHT_COLOR = '#00e5ff'; // sampled from the provided swatch
      let highlightBtn = null;
      let underlineBtn = null;
      let boldBtn = null;
      let lastSelectionRange = null;

      function setBtnActive(btn, active) {
        if (btn) btn.classList.toggle('is-active', active);
      }

      // Same robust tap handling as widget.js's helper, defined locally
      // so it works regardless of script load order (this inline script
      // runs before widget.js loads). Fires once per tap — touchend on
      // touch devices, click otherwise — without double-firing.
      function addTapListener(el, handler) {
        if (!el) return;
        let firedByTouch = false;
        el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        el.addEventListener(
          'touchend',
          (e) => {
            e.preventDefault();
            firedByTouch = true;
            handler(e);
            setTimeout(() => {
              firedByTouch = false;
            }, 500);
          },
          { passive: false }
        );
        el.addEventListener('click', (e) => {
          if (firedByTouch) return;
          handler(e);
        });
      }

      function isWhitespaceOnly(str) {
        return !str || !str.trim();
      }

      function hasClassAncestorWithin(node, root, className) {
        let el = node.parentNode;
        while (el && el !== root) {
          if (el.classList && el.classList.contains(className)) return true;
          el = el.parentNode;
        }
        return false;
      }

      // ---- Why these two checks used to fail after nesting formats ----
      // They used to work by calling range.cloneContents() and walking
      // the CLONED fragment's ancestor chain. That clone only contains
      // whatever sits BETWEEN the range's own boundary points — it does
      // not include any element the range's boundaries happen to sit
      // INSIDE of. So the moment a second format (e.g. bold) gets
      // applied inside an already-formatted span (e.g. highlight), the
      // tracked selection's own container becomes that inner bold span
      // — and cloning from there can no longer "see" the highlight span
      // wrapping it at all, even though it's still very much there in
      // the real page. That's what made the Highlight button go dark
      // after pressing Bold, and made a second Highlight press add a
      // duplicate wrapper instead of removing the existing one.
      //
      // The fix: don't clone anything. Walk the REAL, live text nodes
      // that intersect the range (same intersection test already used
      // by getBlockGroups above) and check each one's actual
      // ancestor chain, all the way up to `content`. Nothing is ever
      // hidden this way, no matter how many formats are nested.
      function getIntersectingTextNodes(range) {
        const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
        const nodes = [];
        let node;
        while ((node = walker.nextNode())) {
          if (isWhitespaceOnly(node.data)) continue;
          if (!rangeIntersectsNode(range, node)) continue;
          nodes.push(node);
        }
        return nodes;
      }

      // True if every non-whitespace character in the range already has
      // `className` somewhere in its real ancestor chain. Whitespace-only
      // text (stray spaces caught at the edge of a selection) is ignored,
      // so a selection with a trailing/leading space still registers as
      // "fully formatted" if the actual words are.
      function isRangeFullyFormatted(range, className) {
        const nodes = getIntersectingTextNodes(range);
        if (!nodes.length) return false;
        return nodes.every((node) => hasClassAncestorWithin(node, content, className));
      }

      // True if AT LEAST ONE non-whitespace character in the range has
      // `className` in its real ancestor chain — used to light up the
      // toolbar buttons. Unlike isRangeFullyFormatted (above), this
      // doesn't require the whole selection to share the formatting:
      // selecting a highlighted word plus some plain trailing text (or
      // stray spaces) still lights the button up, as long as any of
      // the selected text actually has it.
      function isRangeAnyFormatted(range, className) {
        return getIntersectingTextNodes(range).some((node) =>
          hasClassAncestorWithin(node, content, className)
        );
      }

      function unwrapClassFrom(root, className) {
        if (!root.querySelectorAll) return;
        Array.from(root.querySelectorAll('.' + className)).forEach((el) => {
          unwrapElement(el);
        });
      }

      // Removes a single element, splicing its children into its former
      // spot in the parent. Used both by unwrapClassFrom above (each
      // formatting span it finds) and directly on the temporary marker
      // spans in toggleFormatOnRange below.
      function unwrapElement(el) {
        const parent = el.parentNode;
        if (!parent) return;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }

      // ---- Why formatting used to "mess up the content" ----
      // On mobile, a double/triple tap often selects a whole list item
      // or paragraph at the ELEMENT level rather than the text level —
      // e.g. the Range's boundaries land at "child index 1 of <ol>"
      // instead of "character 12 of a text node inside <li>". The old
      // code called range.extractContents()/insertNode() on that range
      // directly, which — when the boundary is element-level — pulls
      // the whole <li> out and re-inserts it wrapped inside a <span>.
      // A <span> containing an <li> isn't valid HTML: the browser
      // renders it, but the list's numbering breaks and, as soon as
      // that HTML gets saved to localStorage and reloaded (which re-
      // parses it as a string), the parser enforces valid nesting and
      // silently drops/relocates content — exactly the empty numbered
      // items in your screenshots.
      //
      // The fix: never run extractContents()/insertNode() on a range
      // that might span outside a single block element. Instead, split
      // the selection into one sub-range per block element (li/p/h3/
      // etc.) it touches, and apply the formatting to each sub-range
      // separately. Each sub-range only ever touches text nodes inside
      // one block, so a <span> can never end up wrapping an <li>.
      const BLOCK_TAGS = new Set(['P', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'DIV', 'BLOCKQUOTE']);

      function getBlockAncestor(node) {
        let el = node.nodeType === 3 ? node.parentElement : node;
        while (el && el !== content) {
          if (BLOCK_TAGS.has(el.tagName)) return el;
          el = el.parentElement;
        }
        return content;
      }

      // Standard "does this range overlap this node" check (boundary
      // touches don't count as overlap, so a range that merely ends at
      // the start of a node doesn't pull that node in).
      function rangeIntersectsNode(range, node) {
        const nodeRange = document.createRange();
        nodeRange.selectNode(node);
        const result =
          range.compareBoundaryPoints(Range.END_TO_START, nodeRange) < 0 &&
          range.compareBoundaryPoints(Range.START_TO_END, nodeRange) > 0;
        nodeRange.detach && nodeRange.detach();
        return result;
      }

      // Splits `range` into an array of {block, startNode, startOffset,
      // endNode, endOffset} groups, one per block element it touches,
      // each confined to text-node boundaries inside that single block.
      // Whitespace-only text nodes (indentation between tags, stray
      // spaces at a selection's edge) are ignored so they never get
      // treated as their own "block".
      function getBlockGroups(range) {
        const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
        const groups = [];
        let node;
        while ((node = walker.nextNode())) {
          if (isWhitespaceOnly(node.data)) continue;
          if (!rangeIntersectsNode(range, node)) continue;

          const block = getBlockAncestor(node);
          const startOffset = node === range.startContainer ? range.startOffset : 0;
          const endOffset = node === range.endContainer ? range.endOffset : node.data.length;
          if (startOffset === endOffset) continue;

          const last = groups[groups.length - 1];
          if (last && last.block === block) {
            last.endNode = node;
            last.endOffset = endOffset;
          } else {
            groups.push({ block, startNode: node, startOffset, endNode: node, endOffset });
          }
        }
        return groups;
      }

      // ---- Why a boundary-splitting step is needed before touching the
      // DOM ----
      // extractContents() only ever hands back whatever sits BETWEEN a
      // range's two boundary points — never anything the range's
      // boundary happens to sit INSIDE of. So if a selection's text
      // already lives inside, say, a highlight span, and that span
      // fully encloses the new selection on both sides, extracting that
      // inner slice silently leaves the highlight span itself behind in
      // the live page — invisible to the code that just extracted it.
      // That's what let a second format (e.g. bold) get applied without
      // "seeing" the highlight still wrapping it, and it's what made a
      // second press of the SAME button re-wrap already-formatted text
      // instead of removing it.
      //
      // The fix is the standard rich-text-editor trick: before touching
      // anything, physically split every element the boundary point
      // sits inside of — text node, and every formatting span above it
      // up to the block — so the point always lands cleanly BETWEEN two
      // siblings rather than in the middle of one. A temporary marker
      // element is dropped at that exact clean point so the caller can
      // find it again by reference (indexes shift as sibling splits
      // happen elsewhere; a live node reference never does).
      const BOUNDARY_MARKER_CLASS = '__boundary_marker__';

      function insertBoundaryMarker(container, offset, block) {
        let node;
        let index;

        if (container.nodeType === 3) {
          if (offset > 0 && offset < container.data.length) {
            container.splitText(offset);
            node = container.parentNode;
            index = Array.prototype.indexOf.call(node.childNodes, container) + 1;
          } else if (offset === container.data.length) {
            node = container.parentNode;
            index = Array.prototype.indexOf.call(node.childNodes, container) + 1;
          } else {
            node = container.parentNode;
            index = Array.prototype.indexOf.call(node.childNodes, container);
          }
        } else {
          node = container;
          index = offset;
        }

        // Climb toward `block`, splitting (cloning) any ancestor that
        // the point currently sits in the middle of, so the point ends
        // up as a clean child-index at every level along the way.
        while (node !== block) {
          const parent = node.parentNode;
          const nodeIndex = Array.prototype.indexOf.call(parent.childNodes, node);
          if (index > 0 && index < node.childNodes.length) {
            const clone = node.cloneNode(false);
            const trailing = Array.prototype.slice.call(node.childNodes, index);
            trailing.forEach((child) => clone.appendChild(child));
            parent.insertBefore(clone, node.nextSibling);
            index = nodeIndex + 1;
          } else if (index === 0) {
            index = nodeIndex;
          } else {
            index = nodeIndex + 1;
          }
          node = parent;
        }

        const marker = document.createElement('span');
        marker.className = BOUNDARY_MARKER_CLASS;
        node.insertBefore(marker, node.childNodes[index] || null);
        return marker;
      }

      // ---- Applying formatting to ONE block group. Drops boundary
      // markers at the clean start/end points (see above), builds a
      // Range between them — now guaranteed not to sit inside any
      // ancestor formatting span — and only then runs the actual
      // extractContents()/insertNode() swap. ----
      function applyFormatToGroup(group, className, styleFn, alreadyFormatted) {
        // End marker first: it only ever inserts new nodes to the right
        // of the start point, so it can never invalidate startNode/
        // startOffset before we get to use them.
        const endMarker = insertBoundaryMarker(group.endNode, group.endOffset, group.block);
        const startMarker = insertBoundaryMarker(group.startNode, group.startOffset, group.block);

        const subRange = document.createRange();
        subRange.setStartAfter(startMarker);
        subRange.setEndBefore(endMarker);
        startMarker.remove();
        endMarker.remove();

        const frag = subRange.extractContents();
        // Always strip any existing spans of this class from the
        // extracted slice first — this both handles the "remove" case
        // and prevents double-nesting when "applying" over a selection
        // that's only partially formatted.
        unwrapClassFrom(frag, className);

        const resultMarker = document.createElement('span');
        resultMarker.className = BOUNDARY_MARKER_CLASS;
        if (!alreadyFormatted) {
          const wrapper = document.createElement('span');
          wrapper.className = className;
          styleFn(wrapper);
          wrapper.appendChild(frag);
          resultMarker.appendChild(wrapper);
        } else {
          resultMarker.appendChild(frag);
        }
        subRange.insertNode(resultMarker);
        return resultMarker;
      }

      // Applies/removes `className` across the whole (possibly
      // multi-block) range and returns a fresh Range spanning exactly
      // the text that was just (un)formatted — so the caller can keep
      // that as the "sticky" selection and immediately apply another
      // format on top of it (e.g. highlight, then underline, then bold,
      // all on the same selected words) without the user re-selecting.
      function toggleFormatOnRange(range, className, styleFn) {
        const alreadyFormatted = isRangeFullyFormatted(range, className);
        const groups = getBlockGroups(range);
        if (!groups.length) return null;

        const markers = groups.map((group) =>
          applyFormatToGroup(group, className, styleFn, alreadyFormatted)
        );

        let newRange = null;
        try {
          newRange = document.createRange();
          newRange.setStartBefore(markers[0]);
          newRange.setEndAfter(markers[markers.length - 1]);
        } catch (err) {
          newRange = null;
        }

        // Unwrap every result marker, leaving just the (now formatted
        // or unformatted) text behind. newRange is a live Range, so the
        // DOM spec keeps its boundary points pointing at the same
        // logical spot as these nodes get spliced out.
        markers.forEach((marker) => unwrapElement(marker));
        content.normalize();

        return newRange && !newRange.collapsed ? newRange : null;
      }

      function getContentSelectionRange() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
        const range = sel.getRangeAt(0);
        if (!content.contains(range.commonAncestorContainer)) return null;
        return range;
      }

      // ---- Sticky selection ----
      // The 3 format buttons don't act on the browser's LIVE selection —
      // they act on `lastSelectionRange`, a range we track ourselves.
      // Why: opening the FAB panel (tapping outside the selected text)
      // can make mobile browsers silently collapse the live selection
      // even though the highlighted text is still visibly selected on
      // screen, which used to make the toolbar buttons go dark for no
      // visible reason. Tracking our own copy means:
      //   - the buttons still light up correctly when you open the
      //     panel over already-formatted text
      //   - pressing highlight/underline/bold doesn't drop the
      //     selection, so you can press more than one of them in a row
      //     on the same selected text
      // It's only cleared when the FAB panel actually closes (tapping
      // empty space, or the icon itself) via the MutationObserver near
      // the bottom of this script.
      function refreshToolbarFromSelection() {
        if (!lastSelectionRange) {
          setBtnActive(highlightBtn, false);
          setBtnActive(underlineBtn, false);
          setBtnActive(boldBtn, false);
          return;
        }
        setBtnActive(highlightBtn, isRangeAnyFormatted(lastSelectionRange, 'user-highlight'));
        setBtnActive(underlineBtn, isRangeAnyFormatted(lastSelectionRange, 'user-underline'));
        setBtnActive(boldBtn, isRangeAnyFormatted(lastSelectionRange, 'user-bold'));
      }

      // Only ADOPTS a new sticky range when there's a genuine, non-
      // collapsed live selection inside the content — it never clears
      // the sticky range just because the live selection momentarily
      // disappears (that's what used to cause the buttons to go dark).
      function syncStickySelectionFromLiveSelection() {
        const range = getContentSelectionRange();
        if (!range) return;
        lastSelectionRange = range.cloneRange();
        refreshToolbarFromSelection();
      }

      function clearStickySelection() {
        lastSelectionRange = null;
        const sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        refreshToolbarFromSelection();
      }

      document.addEventListener('selectionchange', syncStickySelectionFromLiveSelection);
      // selectionchange can lag or misfire on mobile right at the moment
      // a finger lifts — re-check explicitly on touchend as a backstop.
      content.addEventListener('touchend', () => setTimeout(syncStickySelectionFromLiveSelection, 0));

      // ---- Undo / redo history for content edits ----
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const HISTORY_LIMIT = 50;
      let undoStack = [];
      let redoStack = [];
      let restoringHistory = false;

      function updateHistoryButtons() {
        if (undoBtn) undoBtn.disabled = undoStack.length === 0;
        if (redoBtn) redoBtn.disabled = redoStack.length === 0;
      }

      function pushHistory() {
        if (restoringHistory) return;
        undoStack.push(content.innerHTML);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      }

      function restoreSnapshot(html) {
        restoringHistory = true;
        content.innerHTML = html;
        restoringHistory = false;
        saveProgress();
        updateHistoryButtons();
        // The old sticky range may point at nodes that no longer exist
        // post-restore, so drop it rather than risk using a stale range.
        clearStickySelection();
      }

      function undoChange() {
        if (!undoStack.length) return;
        redoStack.push(content.innerHTML);
        restoreSnapshot(undoStack.pop());
      }

      function redoChange() {
        if (!redoStack.length) return;
        undoStack.push(content.innerHTML);
        restoreSnapshot(redoStack.pop());
      }

      addTapListener(undoBtn, undoChange);
      addTapListener(redoBtn, redoChange);

      // ---- Reset: wipes all highlight/underline/bold marks and
      // restores the chapter to the original text straight from
      // chapter-content.js (also clears the saved copy in this
      // browser's storage). Goes on the undo stack first, so a reset
      // done by accident can still be undone. ----
      const resetBtn = document.getElementById('resetBtn');

      function resetChapterContent() {
        const baseHtml = (window.CHAPTER_CONTENT && window.CHAPTER_CONTENT[contentKey]) || '';
        if (content.innerHTML === baseHtml) return;
        const confirmed = window.confirm(
          'Reset this chapter back to its original text? This removes all your highlights, underlines, and bold marks.'
        );
        if (!confirmed) return;

        pushHistory();
        restoringHistory = true;
        content.innerHTML = baseHtml;
        restoringHistory = false;
        redoStack = [];
        updateHistoryButtons();
        saveProgress();
        clearStickySelection();
      }

      addTapListener(resetBtn, resetChapterContent);

      function applyFormatToggle(className, styleFn) {
        const range = lastSelectionRange
          ? lastSelectionRange.cloneRange()
          : getContentSelectionRange();
        if (!range) return;

        pushHistory();
        let newRange = null;
        try {
          newRange = toggleFormatOnRange(range, className, styleFn);
        } catch (err) {
          newRange = null;
        }
        saveProgress();

        // Keep the (possibly re-shaped) range as the sticky selection so
        // another format button can be pressed right after this one,
        // and re-apply it as the visible browser selection too.
        lastSelectionRange = newRange;
        refreshToolbarFromSelection();

        const sel = window.getSelection();
        if (sel) {
          sel.removeAllRanges();
          if (newRange) sel.addRange(newRange);
        }
      }

      function wireToolbarButton(btn, className, styleFn) {
        if (!btn) return;
        addTapListener(btn, () => applyFormatToggle(className, styleFn));
      }

      // ---- Download this chapter as a Word (.doc) file ----
      // Captures whatever's currently in the content box, including any
      // highlight/underline/bold applied — Times New Roman, 8pt, 2 columns.
      function downloadChapterAsWord() {
        const bodyHtml = content.innerHTML.trim() || '<p></p>';
        const doc = `<!doctype html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>Chapter ${num}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page {
    size: 8.5in 11in;
    margin: 1in;
    mso-columns: 2;
  }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 8pt;
    text-align: justify;
  }
  h2, h3 {
    font-family: "Times New Roman", Times, serif;
    font-size: 10pt;
    text-align: left;
  }
  p {
    text-align: justify;
    margin: 0 0 8pt;
  }
  li {
    text-align: justify;
  }
  .doc-columns {
    mso-columns-count: 2;
    column-count: 2;
    column-gap: 24pt;
  }
</style>
</head>
<body>
  <h2>Chapter ${num} \u2014 ${moduleTitle}</h2>
  <div class="doc-columns">${bodyHtml}</div>
</body>
</html>`;

        const blob = new Blob(['\ufeff', doc], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${moduleTitle.replace(/\s+/g, '-')}-Chapter-${num}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ---- FAB options for this page ----
      window.FAB_OPTIONS = [
        {
          id: 'highlight',
          label: 'Highlight text',
          onMount: (btn) => {
            highlightBtn = btn;
            wireToolbarButton(btn, 'user-highlight', (el) => {
              el.style.backgroundColor = HIGHLIGHT_COLOR;
              el.style.color = '#0f172a';
            });
          },
        },
        {
          id: 'underline',
          label: 'Underline text',
          onMount: (btn) => {
            underlineBtn = btn;
            wireToolbarButton(btn, 'user-underline', (el) => {
              el.style.textDecoration = 'underline';
            });
          },
        },
        {
          id: 'bold',
          label: 'Bold text',
          onMount: (btn) => {
            boldBtn = btn;
            wireToolbarButton(btn, 'user-bold', (el) => {
              el.style.fontWeight = '700';
            });
          },
        },
        {
          id: 'assessment-test',
          label: 'Assessment test',
          onSelect: () => {
            // Placeholder for now — tell me what this should do when ready,
            // and I'll wire up autosaving for it the same way as the text.
            console.log('Assessment test clicked:', moduleTitle, 'Chapter', num);
          },
        },
        {
          id: 'download',
          label: 'Download this chapter',
          onSelect: downloadChapterAsWord,
        },
      ];

      // ---- End the sticky selection only when the FAB panel actually
      // closes (tapping empty/random space, tapping the icon again to
      // close it, or Escape — widget.js already treats all of those as
      // "close the panel" by removing the 'is-open' class). Watching
      // for that class change — rather than listening for taps
      // ourselves — means pressing Highlight/Underline/Bold (which
      // never removes 'is-open') never triggers this, so the selection
      // survives across as many format presses as you want.
      //
      // IMPORTANT: widget.js's own "tap anywhere outside the panel"
      // handler calls classList.remove('is-open') on EVERY touch
      // outside the panel — including every tap you make to start
      // selecting text — regardless of whether the panel was even
      // open. Browsers re-fire a class-attribute mutation on every
      // classList.remove() call even when the class wasn't present to
      // begin with, so without the oldValue check below this observer
      // would fire (and wipe the selection) on essentially every tap
      // anywhere on the page — that's what was causing selections to
      // "snap back" instantly. Checking attributeOldValue makes sure
      // we only react to a genuine open -> closed transition. ----
      window.addEventListener('load', () => {
        const fabWrap = document.getElementById('fabWrap');
        if (!fabWrap) return;
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            const wasOpen = (mutation.oldValue || '').split(/\s+/).includes('is-open');
            const isOpenNow = fabWrap.classList.contains('is-open');
            if (wasOpen && !isOpenNow) {
              clearStickySelection();
            }
          });
        });
        observer.observe(fabWrap, {
          attributes: true,
          attributeFilter: ['class'],
          attributeOldValue: true,
        });
      });
    </script>
    <script src="widget.js"></script>
  </body>
</html>
